<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- The dark surface the app paints, so the browser and the splash
             match before Vue has booted. -->
        <meta name="theme-color" content="#0d1014" />
        <!-- iOS installs from the home screen rather than from the manifest,
             and reads these instead. -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Battlezones" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="icon" href="/icons/icon-192.png" type="image/png" />
        <title>Battlezones</title>
    </head>
    <body class="h-full">
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
