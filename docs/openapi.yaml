                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            key:
                              type: string
                            prompt:
                              type: string
                            type:
                              type: string
        404:
          description: 'The link is unknown, already used, or expired.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Events
      security: []
    post:
      summary: 'Submit Feedback'
      operationId: submitFeedback
      description: 'Answers are stored against the Event and the question only — never against the Player. The link is spent afterwards, which is the sole reason the invitation records who it belonged to.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      submitted:
                        type: boolean
        404:
          description: 'The link is unknown, already used, or expired.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: array
                  description: 'One entry per question answered: a rating for rating questions, an answer for text questions. Unanswered questions may be left out.'
                  items:
                    type: object
                    properties:
                      question_id:
                        type: integer
                        description: 'Must match an existing stored value.'
                      rating:
                        type: integer
                        description: 'Must be at least 1. Must not be greater than 5.'
                        nullable: true
                      answer:
                        type: string
                        description: 'Must not be greater than 5000 characters.'
                        nullable: true
                    required:
                      - question_id
              required:
                - answers
      security: []
    parameters:
      -
        in: path
        name: token
        description: 'The token from the feedback email.'
        required: true
        schema:
          type: string
