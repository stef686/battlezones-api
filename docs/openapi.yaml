openapi: 3.0.3
info:
  title: 'Battlezones API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'https://battlezones.test'
tags:
  - name: Authentication
    description: 'APIs for authentication'
  - name: Conversations
    description: 'APIs for Conversations'
  - name: Events
    description: 'APIs for Events'
  - name: Gallery
    description: 'APIs for Gallery'
  - name: Reactions
    description: 'APIs for Reactions'
  - name: Users
    description: 'APIs for Users'
paths:
  /api/login/token:
    post:
      summary: Login
      operationId: login
      description: 'Returns an authorization token for the user'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: '{AUTH_TOKEN}'
                properties:
                  token:
                    type: string
                    example: '{AUTH_TOKEN}'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  email:
                    - 'The provided credentials are incorrect.'
                properties:
                  email:
                    type: array
                    example:
                      - 'The provided credentials are incorrect.'
                    items:
                      type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's email address. Must be a valid email address."
                  example: player@example.com
                password:
                  type: string
                  description: "The user's password."
                  example: password
                device_name:
                  type: string
                  description: 'The name of the device logging in.'
                  example: iPhone
              required:
                - email
                - password
                - device_name
      security: []
  /api/register:
    post:
      summary: Register
      operationId: register
      description: 'Registers a new user'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: '{AUTH_TOKEN}'
                properties:
                  token:
                    type: string
                    example: '{AUTH_TOKEN}'
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    field_name:
                      - 'The field name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        example:
                          - 'The field name field is required.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The user's display name."
                  example: 'John Doe'
                email:
                  type: string
                  description: "The user's email address. Must be a valid email address."
                  example: player@example.com
                password:
                  type: string
                  description: "The new user's desired password."
                  example: password
                device_name:
                  type: string
                  description: 'The name of the device logging in.'
                  example: iPhone
                password_confirmation:
                  type: string
                  description: 'Confirmation of the password field.'
                  example: password
              required:
                - name
                - email
                - password
                - device_name
                - password_confirmation
      security: []
  /api/auth/refresh:
    post:
      summary: 'Refresh Token'
      operationId: refreshToken
      description: 'Exchange a current or recently-expired token for a new one'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: '{AUTH_TOKEN}'
                  expires_at: '2026-05-04T00:00:00Z'
                properties:
                  token:
                    type: string
                    example: '{AUTH_TOKEN}'
                  expires_at:
                    type: string
                    example: '2026-05-04T00:00:00Z'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentication
      security: []
  /api/auth/resend-verification:
    post:
      summary: 'Resend verification email'
      operationId: resendVerificationEmail
      description: 'Resend verification email'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Verification link resent!'
                properties:
                  message:
                    type: string
                    example: 'Verification link resent!'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Email already verified.'
                properties:
                  message:
                    type: string
                    example: 'Email already verified.'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User not found.'
                properties:
                  message:
                    type: string
                    example: 'User not found.'
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    field_name:
                      - 'The field name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        example:
                          - 'The field name field is required.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The new user's email address to send the verification email to."
                  example: test@test.com
              required:
                - email
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: 'Sends a password reset link to the given email address'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'If a user with that email address exists, we have sent a password reset link. Please check your email.'
                properties:
                  message:
                    type: string
                    example: 'If a user with that email address exists, we have sent a password reset link. Please check your email.'
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    field_name:
                      - 'The field name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        example:
                          - 'The field name field is required.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email address associated with the account.'
                  example: user@example.com
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "Resets the user's password using a valid reset token"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Your password has been reset. You may now log in with your new password.'
                properties:
                  message:
                    type: string
                    example: 'Your password has been reset. You may now log in with your new password.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This password reset token is invalid or has expired.'
                properties:
                  message:
                    type: string
                    example: 'This password reset token is invalid or has expired.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The password reset token from the reset email.'
                  example: architecto
                email:
                  type: string
                  description: 'The email address associated with the account.'
                  example: user@example.com
                password:
                  type: string
                  description: 'The new password (minimum 8 characters).'
                  example: new-password
                password_confirmation:
                  type: string
                  description: 'Confirmation of the new password.'
                  example: new-password
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/conversations:
    get:
      summary: 'List Conversations'
      operationId: listConversations
      description: "List the authenticated user's conversations."
      parameters:
        -
          in: query
          name: tab
          description: 'Filter by tab. One of: primary, events, requests, archived.'
          example: primary
          required: false
          schema:
            type: string
            description: 'Filter by tab. One of: primary, events, requests, archived.'
            example: primary
            enum:
              - primary
              - events
              - requests
              - archived
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 134
                    is_group: false
                    name: null
                    participants: []
                    is_archived: false
                    unread_count: 0
                    created_at: '2026-08-23T17:17:08Z'
                    updated_at: '2026-08-23T17:17:08Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 134
                      is_group:
                        type: boolean
                        example: false
                      name:
                        type: string
                        example: null
                        nullable: true
                      participants:
                        type: array
                        example: []
                      is_archived:
                        type: boolean
                        example: false
                      unread_count:
                        type: integer
                        example: 0
                      created_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
                      updated_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
      tags:
        - Conversations
      security: []
    post:
      summary: 'Start Conversation'
      operationId: startConversation
      description: 'Start a new direct or group conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 135
                    is_group: false
                    name: null
                    participants: []
                    is_archived: false
                    unread_count: 0
                    created_at: '2026-08-23T17:17:08Z'
                    updated_at: '2026-08-23T17:17:08Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 135
                      is_group:
                        type: boolean
                        example: false
                      name:
                        type: string
                        example: null
                        nullable: true
                      participants:
                        type: array
                        example: []
                      is_archived:
                        type: boolean
                        example: false
                      unread_count:
                        type: integer
                        example: 0
                      created_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
                      updated_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    field_name:
                      - 'The field name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        example:
                          - 'The field name field is required.'
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
                name:
                  type: string
                  description: 'The group name (required when starting a group conversation with multiple recipients). Must not be greater than 255 characters.'
                  example: 'Game Night Chat'
                  nullable: true
                body:
                  type: string
                  description: 'The initial message body. Must not be greater than 1000 characters.'
                  example: 'Hey, want to play this weekend?'
              required:
                - recipient_ids
                - body
      security: []
  '/api/conversations/{id}':
    get:
      summary: 'Show Conversation'
      operationId: showConversation
      description: 'Get the messages in a conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 58
                    conversation_id: 136
                    user_id: 533
                    body: 'Sit repellat eligendi fugiat eos. Aut libero voluptatibus voluptatum quos error nesciunt dolores ea. Ad quia iure maxime laboriosam dignissimos. Quas quaerat similique dolorem dolor necessitatibus tempore voluptas.'
                    type: null
                    is_system: false
                    is_deleted: false
                    is_edited: false
                    is_editable: true
                    edited_at: null
                    created_at: '2026-08-23T17:17:08Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 58
                      conversation_id:
                        type: integer
                        example: 136
                      user_id:
                        type: integer
                        example: 533
                      body:
                        type: string
                        example: 'Sit repellat eligendi fugiat eos. Aut libero voluptatibus voluptatum quos error nesciunt dolores ea. Ad quia iure maxime laboriosam dignissimos. Quas quaerat similique dolorem dolor necessitatibus tempore voluptas.'
                      type:
                        type: string
                        example: null
                        nullable: true
                      is_system:
                        type: boolean
                        example: false
                      is_deleted:
                        type: boolean
                        example: false
                      is_edited:
                        type: boolean
                        example: false
                      is_editable:
                        type: boolean
                        example: true
                      edited_at:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
      tags:
        - Conversations
      security: []
    delete:
      summary: 'Delete Conversation'
      operationId: deleteConversation
      description: 'Delete a conversation for the authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Conversation deleted.'
                properties:
                  message:
                    type: string
                    example: 'Conversation deleted.'
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/members':
    post:
      summary: 'Add Group Members'
      operationId: addGroupMembers
      description: 'Add new members to a group conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 137
                    is_group: false
                    name: null
                    participants: []
                    is_archived: false
                    unread_count: 0
                    created_at: '2026-08-23T17:17:08Z'
                    updated_at: '2026-08-23T17:17:08Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 137
                      is_group:
                        type: boolean
                        example: false
                      name:
                        type: string
                        example: null
                        nullable: true
                      participants:
                        type: array
                        example: []
                      is_archived:
                        type: boolean
                        example: false
                      unread_count:
                        type: integer
                        example: 0
                      created_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
                      updated_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    field_name:
                      - 'The field name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        example:
                          - 'The field name field is required.'
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
                include_history:
                  type: boolean
                  description: 'Whether new members should see existing message history.'
                  example: false
              required:
                - recipient_ids
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/members/{user_id}':
    delete:
      summary: 'Remove Group Member'
      operationId: removeGroupMember
      description: 'Remove a member from a group conversation.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/leave':
    post:
      summary: 'Leave Group Conversation'
      operationId: leaveGroupConversation
      description: 'Leave a group conversation.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/name':
    patch:
      summary: 'Update Group Name'
      operationId: updateGroupName
      description: 'Update the name of a group conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 138
                    is_group: false
                    name: null
                    participants: []
                    is_archived: false
                    unread_count: 0
                    created_at: '2026-08-23T17:17:08Z'
                    updated_at: '2026-08-23T17:17:08Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 138
                      is_group:
                        type: boolean
                        example: false
                      name:
                        type: string
                        example: null
                        nullable: true
                      participants:
                        type: array
                        example: []
                      is_archived:
                        type: boolean
                        example: false
                      unread_count:
                        type: integer
                        example: 0
                      created_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
                      updated_at:
                        type: string
                        example: '2026-08-23T17:17:08Z'
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    field_name:
                      - 'The field name field is required.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        example:
                          - 'The field name field is required.'
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The new group conversation name. Must not be greater than 255 characters.'
                  example: 'Weekend Warriors'
              required:
                - name
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/archive':
    post:
      summary: 'Archive Conversation'
      operationId: archiveConversation
      description: 'Archive a conversation for the authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Conversation archived.'
                properties:
                  message:
                    type: string
                    example: 'Conversation archived.'
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/unarchive':
    post:
      summary: 'Unarchive Conversation'
      operationId: unarchiveConversation
      description: 'Unarchive a previously archived conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Conversation unarchived.'
                properties:
                  message:
                    type: string
                    example: 'Conversation unarchived.'
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/read':
    post:
      summary: 'Mark Conversation as Read'
      operationId: markConversationAsRead
      description: 'Mark a conversation as read for the authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Conversation marked as read.'
                properties:
                  message:
                    type: string
                    example: 'Conversation marked as read.'
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/messages':
    post:
      summary: 'Send Message'
      operationId: sendMessage
      description: 'Send a new message in a conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 59
                    conversation_id: 139
                    user_id: 534
                    body: 'Et animi quos velit et fugiat. Nihil accusantium harum mollitia modi deserunt. Ab provident perspiciatis quo omnis nostrum aut adipisci.'
                    type: null
                    is_system: false
                    is_deleted: false
                    is_edited: false
                    is_editable: true
                    edited_at: null
                    created_at: '2026-08-23T17:17:08Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 59
                      conversation_id:
                        type: integer
                        example: 139
                      user_id:
                        type: integer
                        example: 534
                      body:
                        type: string
                        example: 'Et animi quos velit et fugiat. Nihil accusantium harum mollitia modi deserunt. Ab provident perspiciatis quo omnis nostrum aut adipisci.'
                      type:
                        type: string
                        example: null
                        nullable: true
                      is_system:
                        type: boolean
                        example: false
                      is_deleted:
                        type: boolean
                        example: false
                      is_edited:
                        type: boolean
                        example: false
                      is_editable:
                        type: boolean
                        example: true
                      edited_at:
