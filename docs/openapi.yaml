openapi: 3.0.3
info:
  title: 'Battlezones API Documentation'
  description: ''
  version: 1.0.0
servers:
  - url: 'https://battlezones.test'
tags:
  - name: Authentication
    description: 'APIs for authentication'
  - name: Conversations
    description: 'APIs for Conversations'
  - name: Events
    description: 'APIs for Events'
  - name: Gallery
    description: 'APIs for Gallery'
  - name: Reactions
    description: 'APIs for Reactions'
  - name: Users
    description: 'APIs for Users'
paths:
  /api/login/token:
    post:
      summary: Login
      operationId: login
      description: 'Returns an authorization token for the user'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: array
                    items:
                      type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's email address. Must be a valid email address."
                password:
                  type: string
                  description: "The user's password."
                device_name:
                  type: string
                  description: 'The name of the device logging in.'
              required:
                - email
                - password
                - device_name
      security: []
  /api/register:
    post:
      summary: Register
      operationId: register
      description: 'Registers a new user'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The user's display name."
                email:
                  type: string
                  description: "The user's email address. Must be a valid email address."
                password:
                  type: string
                  description: "The new user's desired password."
                device_name:
                  type: string
                  description: 'The name of the device logging in.'
                password_confirmation:
                  type: string
                  description: 'Confirmation of the password field.'
              required:
                - name
                - email
                - password
                - device_name
                - password_confirmation
      security: []
  /api/auth/refresh:
    post:
      summary: 'Refresh Token'
      operationId: refreshToken
      description: 'Exchange a current or recently-expired token for a new one'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Authentication
      security: []
  /api/auth/resend-verification:
    post:
      summary: 'Resend verification email'
      operationId: resendVerificationEmail
      description: 'Resend verification email'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The new user's email address to send the verification email to."
              required:
                - email
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: 'Sends a password reset link to the given email address'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'The email address associated with the account.'
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "Resets the user's password using a valid reset token"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The password reset token from the reset email.'
                email:
                  type: string
                  description: 'The email address associated with the account.'
                password:
                  type: string
                  description: 'The new password (minimum 8 characters).'
                password_confirmation:
                  type: string
                  description: 'Confirmation of the new password.'
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/conversations:
    get:
      summary: 'List Conversations'
      operationId: listConversations
      description: "List the authenticated user's conversations."
      parameters:
        -
          in: query
          name: tab
          description: 'Filter by tab. One of: primary, events, requests, archived.'
          required: false
          schema:
            type: string
            description: 'Filter by tab. One of: primary, events, requests, archived.'
            enum:
              - primary
              - events
              - requests
              - archived
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      is_group:
                        type: boolean
                      name:
                        type: string
                        nullable: true
                      participants:
                        type: array
                      is_archived:
                        type: boolean
                      unread_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
      tags:
        - Conversations
      security: []
    post:
      summary: 'Start Conversation'
      operationId: startConversation
      description: 'Start a new direct or group conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      is_group:
                        type: boolean
                      name:
                        type: string
                        nullable: true
                      participants:
                        type: array
                      is_archived:
                        type: boolean
                      unread_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  items:
                    type: integer
                name:
                  type: string
                  description: 'The group name (required when starting a group conversation with multiple recipients). Must not be greater than 255 characters.'
                  nullable: true
                body:
                  type: string
                  description: 'The initial message body. Must not be greater than 1000 characters.'
              required:
                - recipient_ids
                - body
      security: []
  '/api/conversations/{id}':
    get:
      summary: 'Show Conversation'
      operationId: showConversation
      description: 'Get the messages in a conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      conversation_id:
                        type: integer
                      user_id:
                        type: integer
                      body:
                        type: string
                      type:
                        type: string
                        nullable: true
                      is_system:
                        type: boolean
                      is_deleted:
                        type: boolean
                      is_edited:
                        type: boolean
                      is_editable:
                        type: boolean
                      edited_at:
                        type: string
                        nullable: true
                      created_at:
                        type: string
      tags:
        - Conversations
      security: []
    delete:
      summary: 'Delete Conversation'
      operationId: deleteConversation
      description: 'Delete a conversation for the authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/members':
    post:
      summary: 'Add Group Members'
      operationId: addGroupMembers
      description: 'Add new members to a group conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      is_group:
                        type: boolean
                      name:
                        type: string
                        nullable: true
                      participants:
                        type: array
                      is_archived:
                        type: boolean
                      unread_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  items:
                    type: integer
                include_history:
                  type: boolean
                  description: 'Whether new members should see existing message history.'
              required:
                - recipient_ids
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/members/{user_id}':
    delete:
      summary: 'Remove Group Member'
      operationId: removeGroupMember
      description: 'Remove a member from a group conversation.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
      -
        in: path
        name: user_id
        description: 'The ID of the user.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/leave':
    post:
      summary: 'Leave Group Conversation'
      operationId: leaveGroupConversation
      description: 'Leave a group conversation.'
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/name':
    patch:
      summary: 'Update Group Name'
      operationId: updateGroupName
      description: 'Update the name of a group conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      is_group:
                        type: boolean
                      name:
                        type: string
                        nullable: true
                      participants:
                        type: array
                      is_archived:
                        type: boolean
                      unread_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The new group conversation name. Must not be greater than 255 characters.'
              required:
                - name
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/archive':
    post:
      summary: 'Archive Conversation'
      operationId: archiveConversation
      description: 'Archive a conversation for the authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/unarchive':
    post:
      summary: 'Unarchive Conversation'
      operationId: unarchiveConversation
      description: 'Unarchive a previously archived conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/read':
    post:
      summary: 'Mark Conversation as Read'
      operationId: markConversationAsRead
      description: 'Mark a conversation as read for the authenticated user.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/messages':
    post:
      summary: 'Send Message'
      operationId: sendMessage
      description: 'Send a new message in a conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      conversation_id:
                        type: integer
                      user_id:
                        type: integer
                      body:
                        type: string
                      type:
                        type: string
                        nullable: true
                      is_system:
                        type: boolean
                      is_deleted:
                        type: boolean
                      is_edited:
                        type: boolean
                      is_editable:
                        type: boolean
                      edited_at:
                        type: string
                        nullable: true
                      created_at:
                        type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'The message content. Must be at least 1 character. Must not be greater than 1000 characters.'
              required:
                - body
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
  '/api/conversations/{conversation_id}/messages/{id}':
    patch:
      summary: 'Update Message'
      operationId: updateMessage
      description: 'Edit an existing message in a conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      conversation_id:
                        type: integer
                      user_id:
                        type: integer
                      body:
                        type: string
                      type:
                        type: string
                        nullable: true
                      is_system:
                        type: boolean
                      is_deleted:
                        type: boolean
                      is_edited:
                        type: boolean
                      is_editable:
                        type: boolean
                      edited_at:
                        type: string
                        nullable: true
                      created_at:
                        type: string
        422:
          description: 'The submitted data failed validation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  errors:
                    type: object
                    properties:
                      field_name:
                        type: array
                        items:
                          type: string
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'The updated message content. Must be at least 1 character. Must not be greater than 1000 characters.'
              required:
                - body
      security: []
    delete:
      summary: 'Delete Message'
      operationId: deleteMessage
      description: 'Soft-delete a message in a conversation.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      tags:
        - Conversations
      security: []
    parameters:
      -
        in: path
        name: conversation_id
        description: 'The ID of the conversation.'
        required: true
        schema:
          type: integer
      -
        in: path
        name: id
        description: 'The ID of the message.'
        required: true
        schema:
          type: integer
  /api/events:
    get:
      summary: 'List Events'
      operationId: listEvents
      description: 'List publicly visible events with optional filters and search.'
      parameters:
        -
          in: query
          name: search
          description: 'Search events by name. Must not be greater than 255 characters.'
          required: false
          schema:
            type: string
            description: 'Search events by name. Must not be greater than 255 characters.'
        -
          in: query
          name: status
          description: 'Filter by event status. One of: published, active, completed.'
          required: false
          schema:
            type: string
            description: 'Filter by event status. One of: published, active, completed.'
            enum:
              - draft
              - published
              - active
              - completed
              - cancelled
        -
          in: query
          name: game_system
          description: 'Filter by game system slug. Must match an existing stored value.'
          required: false
          schema:
            type: string
            description: 'Filter by game system slug. Must match an existing stored value.'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      description:
                        type: string
                      status:
                        type: string
                      pairing_format:
                        type: string
                      starts_at:
                        type: string
                      ends_at:
                        type: string
                      max_attendees:
                        type: integer
                      venue:
                        type: object
                        properties:
                          name:
                            type: string
                          address:
                            type: string
                          city:
                            type: string
                          country:
                            type: string
                      created_at:
                        type: string
                      updated_at:
                        type: string
      tags:
        - Events
      security: []
  '/api/events/{slug}':
    get:
      summary: 'Show Event'
      operationId: showEvent
      description: 'Get a publicly visible event by slug.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      slug:
                        type: string
                      description:
                        type: string
                      status:
                        type: string
                      pairing_format:
                        type: string
                      starts_at:
                        type: string
                      ends_at:
                        type: string
                      max_attendees:
                        type: integer
                      venue:
                        type: object
                        properties:
                          name:
                            type: string
                          address:
                            type: string
                          city:
                            type: string
                          country:
                            type: string
                      game_system:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          slug:
                            type: string
                      documents:
                        type: array
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      viewer:
                        type: object
                        properties:
                          is_organiser:
                            type: boolean
                            description: 'Whether the reader runs this Event.'
                          is_lead_organiser:
                            type: boolean
                            description: 'Whether the reader leads it, and so may appoint Organisers.'
                          is_attendee:
                            type: boolean
                            description: 'Whether the reader is competing here.'
                          attendee_id:
                            type: integer
                            description: 'The party the reader competes as, if any.'
                            nullable: true
                          permissions:
                            type: object
                            properties:
                              organise:
                                type: boolean
                                description: 'Publish Rounds, correct results, open Polls, read tallies.'
                              register:
                                type: boolean
                                description: 'Enter the Event.'
                              manage_organisers:
                                type: boolean
                                description: 'Appoint and remove Organisers.'
                            required:
                              - organise
                              - register
                              - manage_organisers
                        required:
                          - is_organiser
                          - is_lead_organiser
                          - is_attendee
                          - attendee_id
                        description: 'What the reader may see and do at this Event. Null for an anonymous request.'
                        nullable: true
                    required:
                      - viewer
      tags:
        - Events
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the event.'
        required: true
        schema:
          type: string
  '/api/events/{event_slug}/updates':
    get:
      summary: 'List Event Updates'
      operationId: listEventUpdates
      description: 'List updates for a publicly visible event, pinned first then most recent.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
